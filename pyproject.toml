[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-circuits"
version = "0.1.0"
description = "Tiny transformer for studying how 2D displacement is represented and computed"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["compass_circuits*"]
